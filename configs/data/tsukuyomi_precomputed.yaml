_target_: matcha.data.precomputed_datamodule.PrecomputedTextMelDataModule
name: tsukuyomi_precomputed
train_pt_dir: /dev/shm/tsukuyomi_precomputed/train
val_pt_dir: /dev/shm/tsukuyomi_precomputed/val
batch_size: 16
num_workers: 2
pin_memory: True
# jvs_aligned base (n_spks=100) + Tsukuyomi slot (100) -> 101, matching
# scripts/transfer_speaker_embedding.py --source <jvs_aligned last.ckpt>.
n_spks: 101
n_feats: 80
# jvs_aligned's fmax=8000 mel statistics — the base model's mel_mean/std buffers are these,
# so Tsukuyomi precompute + this config MUST use them (strict-load keeps them).
data_statistics:
  mel_mean: -6.550095
  mel_std: 2.383771
seed: ${seed}
load_durations: false   # MAS (single speaker => no MAS degeneration, the paper's setting)
# ~90 utterances x batch 16: num_buckets>=2 fragments into sub-batches that drop_last discards
# (bucket_size = max(1, n//num_buckets)). num_buckets=1 keeps one bucket -> floor(90/16)=5 batches.
num_buckets: 1
