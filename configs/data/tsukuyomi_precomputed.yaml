_target_: matcha.data.precomputed_datamodule.PrecomputedTextMelDataModule
name: tsukuyomi_precomputed
train_pt_dir: /dev/shm/tsukuyomi_precomputed/train
val_pt_dir: /dev/shm/tsukuyomi_precomputed/val
batch_size: 16
num_workers: 2
pin_memory: True
n_spks: 474          # base MoeSpeech 473 + Tsukuyomi slot (matches transfer_speaker_embedding.py output)
n_feats: 80
# NOTE: MUST be the SAME fmax=11025 stats as the base MoeSpeech run. strict-load overwrites
# the model's mel_mean/std buffers with the base values, so precompute + this config must
# use the base MoeSpeech stats (not Tsukuyomi-specific ones). PLACEHOLDER until filled in.
data_statistics:
  mel_mean: 0.0
  mel_std: 1.0
seed: ${seed}
load_durations: false   # MAS (single speaker => no degeneration, the paper's proven setting)
# ~90 utterances x batch 16: num_buckets>=2 fragments into sub-batches that drop_last discards
# (bucket_size = max(1, n//num_buckets)). num_buckets=1 keeps one bucket -> floor(90/16)=5 batches.
num_buckets: 1
