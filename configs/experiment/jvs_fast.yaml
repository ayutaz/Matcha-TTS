# @package _global_

# Fast Japanese multi-speaker TTS training with JVS corpus (100 speakers)
# Uses pre-computed features and DDP-optimized trainer for maximum throughput
# To execute: python matcha/train.py experiment=jvs_fast

defaults:
  - override /data: jvs_precomputed.yaml
  - override /trainer: ddp_optimized.yaml
  - override /callbacks: default.yaml

tags: ["jvs", "japanese", "multispeaker", "fast"]

run_name: jvs_fast

# 原論文準拠: スケジューラなし、lr=1e-4固定、weight_decay=0.0
model:
  n_vocab: 55
  # bf16-mixed学習時はfused AdamWを無効化（fused + mixed + gradient_clip はクラッシュ）
  optimizer:
    fused: false

compile_model: true
compile_mode: "default"
# Disabled: メモリに余裕があるため再計算オーバーヘッドを除去
gradient_checkpointing: false

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "loss/val"
    patience: 30  # 30 × 10 epochs = 300 epochs of no improvement triggers stop
    min_delta: 0.001
    mode: "min"
    check_finite: true
    verbose: true
  ema:
    _target_: lightning.pytorch.callbacks.EMAWeightAveraging
    decay: 0.9995
    update_every_n_steps: 1
    update_starting_at_epoch: 10  # 原論文準拠

trainer:
  max_epochs: 2500  # 原論文500Kステップに匹敵する~240Kステップ（100話者で十分な学習量）
  # バリデーション頻度: early stoppingを有効に機能させる
  check_val_every_n_epoch: 10
  # bf16-mixed: RTX 5090 DDPで実証済み（jvs_alignedと同構成、+11% steps/sec）。
  # 注意: これはbf16であってFP16ではない。FP16はDuration Predictor品質劣化を招く（2026-04-06検証済み）が、
  # bf16は8bit指数部でoverflowせず品質同等。T4/V100でFP16不安定な環境はCLIで 32-true に戻す
  precision: bf16-mixed
