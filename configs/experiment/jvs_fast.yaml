# @package _global_

# Fast Japanese multi-speaker TTS training with JVS corpus (100 speakers)
# Uses pre-computed features and DDP-optimized trainer for maximum throughput
# To execute: python matcha/train.py experiment=jvs_fast

defaults:
  - override /data: jvs_precomputed.yaml
  - override /trainer: ddp_optimized.yaml
  - override /callbacks: default.yaml

tags: ["jvs", "japanese", "multispeaker", "fast"]

run_name: jvs_fast

model:
  n_vocab: 55
  scheduler:
    type: warmup_cosine_safe
    warmup_steps: 500
    start_factor: 0.1
    T_max: 20000
    eta_min: 5e-5

compile_model: true
compile_mode: "default"
# Disabled: メモリに余裕があるため再計算オーバーヘッドを除去
gradient_checkpointing: false

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "loss/val"
    patience: 10
    min_delta: 0.001
    mode: "min"
    check_finite: true
    verbose: true
  ema:
    _target_: lightning.pytorch.callbacks.EMAWeightAveraging
    decay: 0.9995
    update_every_n_steps: 1
    update_starting_at_epoch: 10

trainer:
  max_epochs: 500
  # DDP待機時間を削減（早期段階のバリデーション頻度を下げる）
  check_val_every_n_epoch: 50
