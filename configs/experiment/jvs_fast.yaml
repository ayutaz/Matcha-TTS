# @package _global_

# Fast Japanese multi-speaker TTS training with JVS corpus (100 speakers)
# Uses pre-computed features and DDP-optimized trainer for maximum throughput
# To execute: python matcha/train.py experiment=jvs_fast

defaults:
  - override /data: jvs_precomputed.yaml
  - override /trainer: ddp_optimized.yaml
  - override /callbacks: default.yaml

tags: ["jvs", "japanese", "multispeaker", "fast"]

run_name: jvs_fast

model:
  n_vocab: 55
  optimizer:
    fused: false  # fused=true is incompatible with FP16 mixed precision + gradient clipping
  scheduler:
    type: warmup_cosine_safe
    warmup_steps: 500
    start_factor: 0.1
    T_max: 48000  # Match actual total steps (500 epochs × ~96 steps/epoch)
    eta_min: 5e-5

compile_model: true
compile_mode: "default"
# Disabled: メモリに余裕があるため再計算オーバーヘッドを除去
gradient_checkpointing: false

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "loss/val"
    patience: 15  # 15 × 10 epochs = 150 epochs of no improvement triggers stop
    min_delta: 0.001
    mode: "min"
    check_finite: true
    verbose: true
  ema:
    _target_: lightning.pytorch.callbacks.EMAWeightAveraging
    decay: 0.9995
    update_every_n_steps: 1
    update_starting_at_epoch: 3  # Start after warmup (500 steps ≈ epoch 5)

trainer:
  max_epochs: 500
  # バリデーション頻度: early stoppingを有効に機能させる
  check_val_every_n_epoch: 10
  # FP16混合精度: encoder/decoderはFP16、loss計算はFP32（明示キャスト済み）
  precision: "16-mixed"
