# https://wandb.ai

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  name: ${run_name} # run name = experiment run_name (jvs_aligned / moespeech_pretrain / ...)
  save_dir: "${paths.output_dir}"
  offline: False # set true (or WANDB_MODE=offline) if the host cannot reach wandb.ai
  id: null # pass correct id to resume experiment!
  anonymous: null # enable anonymous logging
  project: "matcha-tts-ja" # 日本語Matcha-TTS（音響モデル・ボコーダ共通プロジェクト）
  log_model: False # ckpts go to HF, not wandb
  prefix: "" # a string to put at the beginning of metric keys
  # entity: "" # set to your wandb team/user if needed
  group: ""
  tags: ${tags}
  job_type: ""
